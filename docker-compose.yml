services:
  dockermanager:
    build: .
    container_name: dockermanager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockermanager-data:/data
    environment:
      - DATA_DIR=/data

volumes:
  dockermanager-data:
