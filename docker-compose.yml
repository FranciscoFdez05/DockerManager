services:
  dockermanager:
    build: .
    # Cada versión queda etiquetada (dockermanager:1.0.0): docker-update.sh
    # puede volver atrás al instante si la nueva no arranca.
    image: dockermanager:${DOCKERMANAGER_VERSION:-latest}
    container_name: dockermanager
    restart: unless-stopped
    ports:
      # 0.0.0.0 = publicado en todas las interfaces -> accesible desde
      # cualquier equipo de la LAN. ${PORT} lo exporta docker-up.sh a
      # partir de [server] port en config.ini.
      - "0.0.0.0:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockermanager-data:/data
      - ./config.ini:/app/config.ini:ro
    environment:
      - DATA_DIR=/data
      # Mismo puerto dentro del contenedor que el publicado fuera.
      - PORT=${PORT:-3000}
      # Generada por docker-up.sh en el .env. Mantiene viva la sesion
      # entre reinicios del contenedor.
      - SECRET_KEY=${SECRET_KEY:-}

volumes:
  dockermanager-data:
