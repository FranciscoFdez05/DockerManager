; ============================================================
; DockerManager - configuracion
; ============================================================
; Este archivo SI es leido por la app (ver config.py / main.py).
; Puedes editar estos valores y reiniciar el servicio/contenedor
; para aplicarlos. Las variables de entorno (DATA_DIR, PORT, HOST,
; DOCKER_HOST), si estan definidas, tienen prioridad sobre este
; archivo -- util para docker-compose sin tener que tocar el .ini.
; ============================================================

[server]
; Puerto en el que escucha la app (uvicorn)
port = 3000
; Direccion de bind. 0.0.0.0 = accesible desde cualquier interfaz de red
bind_host = 0.0.0.0

[docker]
; Directorio donde se guarda config.json (usuario/hash de password)
data_dir = ./data
; Socket Unix de Docker. Se usa solo si la variable de entorno
; DOCKER_HOST no esta definida.
docker_socket = /var/run/docker.sock

[security]
; Nombre de la cookie de sesion
session_cookie_name = dm_session
; Duracion de la sesion en dias
session_max_age_days = 30
; Coste del hash bcrypt para las contraseñas (10-14 recomendado)
bcrypt_cost = 12
; Intentos de login fallidos antes de bloquear la IP
max_login_attempts = 5
; Minutos de bloqueo tras superar max_login_attempts
lockout_minutes = 15

[cdn]
; Origen externo permitido en la Content-Security-Policy
; (xterm.js, chart.js, etc. servidos desde aqui)
jsdelivr = https://cdn.jsdelivr.net
