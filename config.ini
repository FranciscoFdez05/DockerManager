; ============================================================
; DockerManager - configuracion
; ============================================================
; Este archivo SI es leido por la app (ver config.py / main.py).
; Puedes editar estos valores y reiniciar el servicio/contenedor
; para aplicarlos. Las variables de entorno (DATA_DIR, PORT, HOST,
; DOCKER_HOST), si estan definidas, tienen prioridad sobre este
; archivo -- util para docker-compose sin tener que tocar el .ini.
; ============================================================

[server]
; Puerto en el que escucha la app (uvicorn)
port = 3000
; Direccion de bind. 0.0.0.0 = accesible desde cualquier interfaz de red
bind_host = 0.0.0.0

[docker]
; Directorio donde se guarda config.json (usuario/hash de password)
data_dir = ./data
; Socket Unix de Docker. Se usa solo si la variable de entorno
; DOCKER_HOST no esta definida.
docker_socket = /var/run/docker.sock

[security]
; Nombre de la cookie de sesion
session_cookie_name = dm_session
; Duracion de la sesion en dias
session_max_age_days = 30
; Coste del hash bcrypt para las contraseñas (10-14 recomendado)
bcrypt_cost = 12
; Intentos de login fallidos antes de bloquear la IP
max_login_attempts = 5
; Minutos de bloqueo tras superar max_login_attempts
lockout_minutes = 15
; Proxies inversos de confianza (IPs o redes CIDR separadas por comas).
; Solo si la conexion llega de uno de ellos se usa X-Forwarded-For para saber
; la IP real del cliente. Vacio = acceso directo, se ignora esa cabecera
; (cualquiera podria falsearla y saltarse el bloqueo por intentos).
; Ejemplo con Nginx en el mismo host: trusted_proxies = 127.0.0.1
trusted_proxies =

[actualizacion]
; Comprobar si hay una version nueva publicada. Se lee version.py de la rama
; del repositorio en GitHub: es lo que traeria docker-update.sh al hacer pull.
comprobar = true
repositorio = FranciscoFdez05/DockerManager
rama = main
timeout_segundos = 5
; Horas que se recuerda la respuesta de GitHub (el boton "Comprobar" la salta)
cache_horas = 6
; Directorio compartido con el vigilante del host (tools/actualizador/).
; En Docker lo fija ACTUALIZACION_DIR en docker-compose.yml.
directorio = ./data/actualizacion

[servidor]
; Panel "Servidor": metricas del host (CPU, memoria, disco, temperaturas).
; Umbrales en grados C para colorear temperaturas cuando el propio sensor
; no publica los suyos (high / critical).
temperatura_aviso = 70
temperatura_critica = 85
; Ruta cuyo sistema de ficheros se muestra como disco. Dentro del contenedor
; "/" es la capa overlay, que vive en el disco donde Docker guarda sus datos.
ruta_disco = /

[limpieza]
; Antiguedad minima (dias) que propone la ventana "Limpiar" para borrar
; imagenes y volumenes que ningun contenedor usa. 0 = cualquier antiguedad.
dias_por_defecto = 30
; Tope que acepta la API para ese valor
dias_maximos = 3650

[telegram]
; Avisos por Telegram. El token y los IDs se configuran en la web (Ajustes >
; Avisos) o en el .env (TELEGRAM_BOT_TOKEN / TELEGRAM_IDS_PERMITIDOS), NUNCA
; aqui: este archivo esta en el repositorio. Lo que se guarde desde la web
; (data/telegram-config.json) tiene prioridad sobre los valores de abajo.
; Categorias de aviso (separadas por comas):
;   sistema          arranque de la app
;   contenedores     caida con error, OOM, unhealthy, bucle de reinicios
;   seguridad        login correcto, IP bloqueada, cambio de contraseña
;   actualizaciones  version nueva publicada y resultado de la actualizacion
;   recursos         temperatura de CPU critica ([servidor] temperatura_critica) y disco lleno
notificar = sistema, contenedores, seguridad, actualizaciones, recursos
; Timeout de cada peticion a la API de Telegram
timeout_segundos = 10
; Cada cuanto se comprueban recursos y actualizaciones
intervalo_segundos = 60
; Porcentaje de disco usado a partir del que se avisa
disco_aviso_pct = 90
; Caidas de un mismo contenedor en la ventana que cuentan como bucle de reinicios
reinicios_bucle = 3
ventana_bucle_minutos = 10

[cdn]
; Origen externo permitido en la Content-Security-Policy
; (xterm.js, chart.js, etc. servidos desde aqui)
jsdelivr = https://cdn.jsdelivr.net
